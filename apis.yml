- aid: university-of-north-carolina-at-chapel-hill:shibboleth-idp
  name: UNC Shibboleth Identity Provider (SAML 2.0 / InCommon)
  description: >-
    UNC's Onyen single sign-on is a Shibboleth Identity Provider that publishes SAML 2.0 metadata
    at its canonical /idp/shibboleth location — an EntityDescriptor with an IDPSSODescriptor and
    HTTP-POST, HTTP-POST-SimpleSign and HTTP-Redirect SingleSignOnService bindings. The same IdP
    is registered in the InCommon federation (and thereby eduGAIN) as
    urn:mace:incommon:unc.edu, whose signed metadata the InCommon MDQ service returns on demand.
    This is the one programmable surface a university operates by definition and it is almost
    never catalogued.
  humanURL: https://sso.unc.edu/
  baseURL: https://sso.unc.edu/idp
  x-operator: institution
  x-operator-evidence: >-
    sso.unc.edu CNAMEs to ssop.isis.unc.edu (152.2.64.79), UNC's own identity infrastructure.
    Federation membership under urn:mace:incommon:unc.edu is an institutional fact registered by
    UNC itself; no vendor sits between UNC and this metadata.
  tags:
