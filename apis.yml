apis:
- aid: university-of-north-carolina-at-chapel-hill:cdr-services-api
  name: Carolina Digital Repository Services API (box-c)
  description: >-
    Public, keyless JSON API behind the Carolina Digital Repository, UNC Libraries' institutional
    repository for digitized special collections, theses, dissertations and research output.
    GET /services/api/search returns Solr-backed results over 2,102,332 indexed records with
    faceting, and the same service publishes IIIF Presentation API 3.0 manifests
    (/services/api/iiif/v3/{id}/manifest) and IIIF Image API 3.0 image information
    (/services/api/iiif/v3/{id}/info.json). Errors are returned as RFC 7807
    application/problem+json. The service is box-c — a Java/Spring application that UNC Libraries
    itself writes, tests and releases in the open at https://github.com/UNC-Libraries/box-c — so
    both the deployment and the contract are UNC's own engineering. Some administrative paths
    (/services/api/status) return 401 and are staff-only. There is no published API reference:
    the endpoints below were found by probe, and the source repository is the documentation.
  humanURL: https://dcr.lib.unc.edu/aboutRepository
  baseURL: https://dcr.lib.unc.edu/services/api
  x-operator: institution
  x-operator-evidence: >-
    dcr.lib.unc.edu is under UNC's own registrable domain and CNAMEs to hawadax.lib.unc.edu
    (152.2.176.62), inside UNC Libraries' own network. The application serving it, box-c, is
    authored and maintained by UNC Libraries (github.com/UNC-Libraries/box-c, homepage
    https://dcr.lib.unc.edu/aboutRepository, last pushed 2026-08-28). No vendor contract is
    involved: UNC wrote this one.
