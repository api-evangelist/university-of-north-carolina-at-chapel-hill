- aid: university-of-north-carolina-at-chapel-hill:dataverse-native-api
  name: UNC Dataverse Native REST API (Dataverse deployment)
  description: >-
    UNC Dataverse, the Odum Institute's research data repository, runs Dataverse 6.8 and exposes
    the Dataverse Native REST API at /api. GET /api/info/version is keyless and returned
    {"version":"6.8","build":"with-mdq-bugfix"} on 2026-08-30; GET /api/search returns 401
    "Only authenticated users can perform the requested operation" and needs an X-Dataverse-key
    token. The deployment is UNC's and the data in it is UNC's, but the contract is the Dataverse
    product's — identical in title, description and shape to the specs eight other institutions in
    this catalog ship — so no OpenAPI is stored under this profile. Thirty-six per-tag OpenAPI
    documents, their pristine source spec and 84 artifacts derived from them — 122 files in all —
    were removed from this repository on 2026-08-30 for exactly that reason. Score the contract against Dataverse's own project, not against UNC.
  humanURL: https://dataverse.unc.edu/
  baseURL: https://dataverse.unc.edu/api
  x-operator: tenant
  x-operator-evidence: >-
    The host is UNC's (dataverse.unc.edu CNAME dataverse-aws.irss.unc.edu), so a hostname-only
    verdict reads `institution` — but the contract is host-independent. info.title "Dataverse
    API", info.description "Open source research data repository software" and version 6.8 are the
    Dataverse project's, and audit-university-contracts.py finds the same normalized titles
    shipped by harvard, maastricht, ntnu, queens-university-at-kingston and four others. The
    relationship is real and is kept; the product's spec is not.
