- aid: university-of-north-carolina-at-chapel-hill:digital-collections
  name: UNC Digital Collections Search (OCLC CONTENTdm)
  description: >-
    "Search the Special Collections", UNC University Library's discovery layer over its digitized
    special collections. A WordPress front at the root fronts an OCLC CONTENTdm 6.10 installation
    that handles /digital/ and all unmatched paths. This entry corrects an earlier profile that
    described dc.lib.unc.edu as running box-c: box-c is real and is UNC's own work, but its
    deployment is the Carolina Digital Repository at dcr.lib.unc.edu (recorded separately above),
    not this host. No keyless CONTENTdm API path was found in probing on 2026-08-30 —
    /digital/api/search/collection/all, /api/listJson/collections and /iiif/v3/collection/root all
    returned HTML or 404 from the CONTENTdm error handler.
  humanURL: https://dc.lib.unc.edu/
  x-operator: tenant
  x-operator-evidence: >-
    dc.lib.unc.edu CNAMEs to lookout.lib.unc.edu (152.2.176.89), so UNC runs the server — but the
    application, the URL scheme and any API contract are OCLC CONTENTdm's, identified from the
    "CONTENTdm Version 6.10.0.473s/6.10.0.918w (c) OCLC" comment served on its own error pages.
    Recorded as tenant on the same principle as the Dataverse deployment: institution-hosted,
    vendor-contracted.
  tags:
