- aid: university-of-north-carolina-at-chapel-hill:course-catalog-search
  name: UNC Catalog Course Search API (CourseLeaf)
  description: >-
    The University Catalog exposes a keyless JSON course-search API at
    /course-search/api/?page=fose&route=search. A POST carrying a criteria array returns
    {"srcdb","count","results":[{"key","code","srcdb","title","offsets","rank"}]} — a live query
    for "computer" returned 278 UNC courses for srcdb 2026 on 2026-08-30. This is the closest
    thing UNC has to a public course-catalog API. The contract is CourseLeaf's "fose" search
    interface, shipped identically by every Leepfrog customer, so the deployment is recorded and
    the interface is not credited to UNC.
  humanURL: https://catalog.unc.edu/
  baseURL: https://catalog.unc.edu/course-search/api/
  x-operator: tenant
  x-operator-evidence: >-
    catalog.unc.edu CNAMEs to unc-public.courseleaf.com (12.175.6.47) — UNC's branded tenant on
    Leepfrog's CourseLeaf platform. The course data is UNC's; the platform, the endpoint shape and
    the fose protocol are Leepfrog's.
  tags:
  - Course Catalog
  - Registrar
  - CourseLeaf
  - Search
  properties:
  - type: Website
    url: https://catalog.unc.edu/
  - type: CourseCatalog
