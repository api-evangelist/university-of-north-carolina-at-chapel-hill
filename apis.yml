- aid: university-of-north-carolina-at-chapel-hill:dataverse-oai-pmh
  name: UNC Dataverse OAI-PMH Archive
  description: >-
    OAI-PMH 2.0 harvesting endpoint for the UNC Dataverse research data repository, operated by
    the Odum Institute / Institute for Research in Social Science. Identify reports repositoryName
    "UNC Dataverse Dataverse OAI Archive", protocolVersion 2.0, granularity
    YYYY-MM-DDThh:mm:ssZ, earliestDatestamp 2016-11-09, and gzip/deflate compression.
    ListMetadataFormats advertises oai_dc, oai_ddi, dataverse_json and both `Datacite` and
    `oai_datacite`. Keyless, live and verified on 2026-08-30. Recorded separately from the
    Dataverse native REST API because OAI-PMH is an open standard rather than a product contract:
    the interface is the community's, the archive and the metadata are UNC's.
  humanURL: https://dataverse.unc.edu/
  baseURL: https://dataverse.unc.edu/oai
  x-operator: institution
  x-operator-evidence: >-
    dataverse.unc.edu CNAMEs to dataverse-aws.irss.unc.edu (52.22.144.218), an AWS deployment in
    UNC's own IRSS/Odum account, and the OAI adminEmail is
    do-not-reply@dataverse-aws.rdmc.unc.edu. The harvesting interface conforms to OAI-PMH 2.0, a
    published open standard, so no vendor owns the contract.
  tags:
