aid: university-of-north-carolina-at-chapel-hill
name: University of North Carolina at Chapel Hill
description: >-
  The University of North Carolina at Chapel Hill is a public research university in Chapel Hill,
  North Carolina, a member of the Association of American Universities and the flagship of the
  seventeen-campus University of North Carolina System. It operates no central developer portal,
  no API gateway, and publishes no OpenAPI of its own — but it does run several genuinely
  institution-engineered machine-readable surfaces. The strongest is the Carolina Digital
  Repository services API at dcr.lib.unc.edu, including IIIF Presentation 3.0 and Image 3.0
  endpoints, served by box-c, a repository application UNC Libraries writes and maintains in the
  open on GitHub. Alongside it are two Blacklight JSON search APIs on UNC's own hardware (the TRLN
  Discovery library catalog and the Wilson Library finding aids), an OAI-PMH 2.0 archive on UNC
  Dataverse advertising DataCite metadata, and UNC's own Shibboleth/InCommon SAML 2.0 metadata.
  The rest of the programmable footprint is tenant relationships rather than UNC engineering: the
  UNC Dataverse native REST API is the Dataverse product's contract, the course-catalog search API
  is Leepfrog CourseLeaf's, the GIS open-data hub is Esri ArcGIS Hub's, and the Digital
  Collections search at dc.lib.unc.edu is OCLC CONTENTdm. The Facilities SPOTS REST API is
  institution-operated but its documentation is entirely Onyen-gated and could not be read.
