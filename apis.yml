x-coverage:
  state: covered
  reason: covered
  detail: >-
    UNC-Chapel Hill operates five verified institution-owned machine-readable surfaces — the
    Carolina Digital Repository services API and its IIIF 3.0 endpoints (box-c, software UNC
    Libraries writes itself), the TRLN Discovery library catalog JSON API, the Wilson Library
    finding-aids JSON:API, the UNC Dataverse OAI-PMH 2.0 archive, and its own Shibboleth/InCommon
    SAML 2.0 metadata — plus one institution-operated surface, the Facilities SPOTS REST API, that
    is entirely Onyen-gated and whose contract could not be read. Four further surfaces are tenant
    relationships and their contracts are not credited to UNC: the Dataverse native REST API
    (Dataverse's contract, shipped by eight institutions in this catalog), the course-catalog
    search API (Leepfrog CourseLeaf, catalog.unc.edu CNAME unc-public.courseleaf.com), the GIS
    open-data hub (Esri ArcGIS Hub) and the Digital Collections search (OCLC CONTENTdm). UNC
    publishes no developer portal, no API gateway, no API terms of service and no OpenAPI of its
    own; the thirty-six per-tag OpenAPI documents this repository previously held were the
    Dataverse product's spec split by refine-openapis, and they, their pristine source spec and 84
    artifacts derived from them — 122 files — were removed on 2026-08-30. An earlier claim that dc.lib.unc.edu runs box-c was corrected:
    that host is OCLC CONTENTdm, and box-c runs the Carolina Digital Repository at
    dcr.lib.unc.edu.
