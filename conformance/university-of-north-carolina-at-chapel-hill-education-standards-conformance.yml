    status: 200
    content_type: application/samlmetadata+xml
    detail: >-
      UNC-Chapel Hill is a registered InCommon (and thereby eduGAIN) entity. The InCommon MDQ
      service returns a signed SAML 2.0 EntityDescriptor for entityID urn:mace:incommon:unc.edu,
      mdui:DisplayName "University of North Carolina at Chapel Hill", validUntil
      2026-09-13T18:37:27Z, with two IDPSSODescriptor blocks whose SSO Locations are all under
      https://sso.unc.edu/idp/. Note the federation registers the legacy urn: entityID while the
      IdP's own metadata endpoint declares https://sso.unc.edu/idp; both describe the same IdP.
      Federation membership is an institution-operated fact by definition.
