standards:
- id: shibboleth
  status: conformant
  operator: institution
  evidence:
    url: https://sso.unc.edu/idp/shibboleth
    status: 200
    content_type: application/xml;charset=UTF-8
    detail: >-
      UNC's Shibboleth Identity Provider publishes SAML 2.0 metadata at its canonical
      /idp/shibboleth location (6,875 bytes). The document is an <EntityDescriptor> carrying
      entityID="https://sso.unc.edu/idp" with an <md:IDPSSODescriptor> and three
      <md:SingleSignOnService> bindings (HTTP-POST, HTTP-POST-SimpleSign, HTTP-Redirect). The
      host is under UNC's own registrable domain and resolves to ssop.isis.unc.edu (152.2.64.79),
      inside UNC's own network. No vendor sits between UNC and this metadata.
